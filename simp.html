<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Kicks Sneakers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="contenedor">
    <h1>Kicks Sneakers</h1>
    <p>Busca zapatillas por marca o modelo</p>

    <!-- Campo de búsqueda + Botón -->
    <div class="caja-busqueda">
      <input type="text" id="buscador" placeholder="Escribe marca o modelo (ej. Nike, Jordan)...">
      <button onclick="obtenerZapatillas()">Obtener</button>
    </div>

    <div id="catalogo" class="grid-zapatillas"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
